name: SLC Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  slc-review:
    if: |
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review') &&
      !contains(github.event.pull_request.labels.*.name, 'tiny')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run SLC Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request using our SLC (Simple, Lovable, Complete) principles for the IdeaSpaces SDK.

            ## Context
            - This repo: `@ideaspaces/sdk` — the **platform transport layer**. It owns the Keeper event vocabulary and the Pi→Keeper translator.
            - Portable repository shape belongs in `@ideaspaces/protocol`, which consumers import directly. SDK's transitional protocol re-export is intentionally ending in 0.2 rather than becoming a permanent compatibility barrel.
            - Concrete agent-tool signatures are harness-owned. The transitional `COMMON_TOOL_CONTRACT` test policy is also intentionally ending rather than moving elsewhere.
            - SDK should have zero runtime dependencies after the 0.2 cleanup. ESM-only via `tsc`; tests via vitest.
            - Reference: monorepo CLAUDE.md (root principles); `@ideaspaces/protocol` for portable shape.

            ## SLC label context
            - `slc:simple` / `slc:lovable` / `slc:complete`: quick validation for labeled dimensions, deeper review for unlabeled.
            - `needs:slc-review`: do deeper analysis.
            - No SLC labels: standard full review.

            ## SLC Framework Review

            ### Simple 🎯
            - Is this the simplest implementation that solves the problem?
            - Functional API preferred over class wrappers unless state lifecycle earns one.
            - Does it avoid pulling in deps when stdlib + Node primitives would do (filesystem, child_process, no js-yaml unless real semantic parsing is needed)?
            - Any unnecessary new abstractions?

            ### Lovable ❤️
            - Keeper event types and translation helpers have clear names, predictable defaults, and safe error behavior.
            - Consumers import portable shape directly from `@ideaspaces/protocol` and platform transport directly from `@ideaspaces/sdk`; package ownership is obvious at the import site.
            - Breaking removals include concise migration guidance rather than retaining misleading compatibility aliases.

            ### Complete 🏁
            - Tests cover the exact surviving public platform surface and translator behavior.
            - No shape logic or harness-specific tool policy is implemented here; no unused exports, stale build artifacts, or dead code remain.
            - `tsc --noEmit` is clean; `npm test` passes; `npm run build` produces only current ESM declarations and JavaScript in `dist/`.
            - Packaging checks prove obsolete protocol and tool-contract artifacts cannot leak through a stale `dist/` directory.

            ## SDK-specific checks
            - **Keep the ownership boundary strict.** Shape primitives (frontmatter, `_agent/` contract, awareness, git, drift) live in `@ideaspaces/protocol`; concrete tool signatures and cross-field validation live in each harness.
            - **Keep the platform surface evidenced.** Today that means Keeper transport + Pi→Keeper translation. Do not speculate auth, sync, spaces, graph, or API-client abstractions without a real consumer.
            - **Keep SDK zero-runtime-dependency.** Prefer platform-neutral types and pure translation; additions must earn any dependency.
            - **Guard the shipped package, not just source.** Clean before build/prepare and check the exact current export/package surface so deleted artifacts cannot survive in `dist/`.
            - **Treat 0.2 removals as intentional.** Do not request restoration of the protocol re-export, protocol dependency, `COMMON_TOOL_CONTRACT`, or `./tool-contract` export.

            ## Anti-pattern detection 🚨
            - Re-implementing, wrapping, or re-exporting shape that belongs in `@ideaspaces/protocol`.
            - Centralizing concrete MCP/Pi/Claude tool signatures in the SDK.
            - Speculative platform API no evidenced consumer needs yet.
            - Adding runtime dependencies without earning them.
            - Allowing stale `dist/` files or package exports to preserve removed APIs accidentally.

            ## Output format

            **SLC Assessment:**
            - ✅/⚠️/❌ Simple: [brief assessment]
            - ✅/⚠️/❌ Lovable: [brief assessment]
            - ✅/⚠️/❌ Complete: [brief assessment]

            **Anti-Patterns Found:** [list or "None detected"]

            **SDK-Specific Issues:** [list or "None detected"]

            **Detailed Feedback:** [specific issues and suggestions]

            **Recommendation:** Approve / Request Changes / Comment

            Use `gh pr comment` to post your review.

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
